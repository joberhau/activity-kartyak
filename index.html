<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Activity kártyák</title>
<style>
  :root {
    --bg: #f4f1ea; --text: #1f2430; --muted: #5d6475;
    --draw: #e0572f; --talk: #2b7bd6; --mime: #2f9e6a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16181d; --text: #eef0f5; --muted: #a2a9b8; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, sans-serif; }

  .toolbar { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 12px 16px; background: var(--bg); border-bottom: 1px solid rgba(128,128,128,.3); }
  .toolbar h1 { font-size: 18px; margin: 0 8px 0 0; }
  .toolbar button { font: inherit; padding: 6px 12px; border-radius: 8px; border: 1px solid rgba(128,128,128,.5);
    background: transparent; color: var(--text); cursor: pointer; }
  .toolbar button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
  .toolbar .grow { flex: 1; }
  .hint { color: var(--muted); font-size: 13px; padding: 8px 16px 0; }

  .page { display: grid; grid-template-columns: repeat(3, 63mm); grid-auto-rows: 88mm; justify-content: center;
    gap: 0; padding: 16px 0; }
  .card { position: relative; width: 63mm; height: 88mm; padding: 4mm; display: flex; flex-direction: column;
    border: 0.3mm dashed rgba(128,128,128,.6); background: #fffdf8; color: #1f2430; break-inside: avoid; }
  .card .inner { flex: 1; display: flex; flex-direction: column; border-radius: 4mm; overflow: hidden;
    border: 0.8mm solid var(--c); }
  .card .head { background: var(--c); color: #fff; display: flex; align-items: center; gap: 2mm;
    padding: 2.5mm 3mm; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; font-size: 11pt; }
  .card .icon { font-size: 18pt; line-height: 1; }
  .card .word { flex: 1; display: grid; place-items: center; text-align: center; padding: 3mm;
    font-size: 21pt; font-weight: 700; line-height: 1.1; word-break: break-word; hyphens: auto; }
  .card .foot { display: flex; align-items: center; justify-content: space-between; padding: 2mm 3mm 3mm;
    color: var(--c); font-weight: 700; font-size: 10pt; }
  .dots { display: flex; gap: 1.2mm; }
  .dots i { width: 3.4mm; height: 3.4mm; border-radius: 50%; border: 0.5mm solid var(--c); }
  .dots i.on { background: var(--c); }
  .pts { font-size: 20pt; line-height: 1; }
  .c-draw { --c: var(--draw); } .c-talk { --c: var(--talk); } .c-mime { --c: var(--mime); }

  @media print {
    @page { size: A4; margin: 10mm 0; }
    body { background: #fff; }
    .toolbar, .hint { display: none; }
    .page { padding: 0; page-break-after: always; break-after: page; }
    .page:last-child { page-break-after: auto; break-after: auto; }
  }
  @media (max-width: 700px) and (not print) {
    .page { grid-template-columns: repeat(auto-fill, 63mm); }
  }
</style>
</head>
<body>
<div class="toolbar" role="toolbar" aria-label="Szűrés">
  <h1>Activity kártyák</h1>
  <button data-f="all" aria-pressed="true">Mind</button>
  <button data-f="draw" aria-pressed="false">✏️ Rajzolás</button>
  <button data-f="talk" aria-pressed="false">🗣️ Körülírás</button>
  <button data-f="mime" aria-pressed="false">🎭 Mutogatás</button>
  <span class="grow"></span>
  <button id="shuffle">Keverés</button>
  <button id="print">Nyomtatás</button>
</div>
<div class="hint">Nyomtatáskor A4, 100% méret, margó nélkül. Minden oldalon 3×3 kártya van, a szaggatott vonal mentén kivágható. Kategóriánként szűrhetsz is.</div>
<div id="root"></div>

<script>
  // [szó, pont]. A pont a nehézség: 3 könnyű, 6 nehéz.
  const DATA = {
    draw: { name: "Rajzolás", icon: "✏️", words: [
      ["Ház",3],["Fa",3],["Nap",3],["Hal",3],["Virág",3],["Labda",3],
      ["Hóember",4],["Esernyő",4],["Szivárvány",4],["Autó",4],["Kastély",4],["Gitár",4],
      ["Hőlégballon",5],["Vízesés",5],["Tengeralattjáró",5],["Fagylalt",5],["Kaktusz",5],["Fogaskerék",5],
      ["Időgép",6],["Születésnap",6],["Karácsony",6],["Idegen bolygó",6],["Internet",6],["Szabadság",6]
    ]},
    talk: { name: "Körülírás", icon: "🗣️", words: [
      ["Kutya",3],["Pizza",3],["Iskola",3],["Tengerpart",3],["Szék",3],["Esernyő",3],
      ["Könyvtár",4],["Hűtőszekrény",4],["Vulkán",4],["Mozi",4],["Biciklis",4],["Szemüveg",4],
      ["Horgászbot",5],["Pénztárca",5],["Bolhapiac",5],["Műszakváltás",5],["Gyorsétterem",5],["Időjárás",5],
      ["Lámpaláz",6],["Türelem",6],["Nosztalgia",6],["Nyugdíj",6],["Demokrácia",6],["Kíváncsiság",6]
    ]},
    mime: { name: "Mutogatás", icon: "🎭", words: [
      ["Alvás",3],["Fogmosás",3],["Evés",3],["Zuhanyzás",3],["Telefonálás",3],["Nevetés",3],
      ["Fodrász",4],["Focista",4],["Fényképezés",4],["Síelés",4],["Horgász",4],["Szobafestő",4],
      ["Tűzoltó",5],["Vihar a tengeren",5],["Esküvő",5],["Cirkuszi bűvész",5],["Pékség",5],["Autószerelő",5],
      ["Titanic",6],["Micimackó",6],["Jégvarázs",6],["Harry Potter",6],["A Gyűrűk Ura",6],["Oroszlánkirály",6]
    ]}
  };

  const cards = [];
  for (const [key, cat] of Object.entries(DATA)) {
    for (const [word, pts] of cat.words) cards.push({ key, word, pts, cat });
  }

  let filter = "all";
  const root = document.getElementById("root");

  function cardEl(c) {
    const el = document.createElement("div");
    el.className = "card c-" + c.key;
    const dots = Array.from({ length: 6 }, (_, i) => `<i class="${i < c.pts ? "on" : ""}"></i>`).join("");
    el.innerHTML = `
      <div class="inner">
        <div class="head"><span class="icon">${c.cat.icon}</span>${c.cat.name}</div>
        <div class="word"></div>
        <div class="foot"><span class="dots" aria-hidden="true">${dots}</span><span class="pts">${c.pts}</span></div>
      </div>`;
    el.querySelector(".word").textContent = c.word;
    return el;
  }

  function render() {
    root.textContent = "";
    const shown = cards.filter((c) => filter === "all" || c.key === filter);
    for (let i = 0; i < shown.length; i += 9) {
      const page = document.createElement("div");
      page.className = "page";
      shown.slice(i, i + 9).forEach((c) => page.appendChild(cardEl(c)));
      root.appendChild(page);
    }
  }

  document.querySelectorAll("[data-f]").forEach((b) => b.addEventListener("click", () => {
    filter = b.dataset.f;
    document.querySelectorAll("[data-f]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    render();
  }));

  document.getElementById("shuffle").addEventListener("click", () => {
    for (let i = cards.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [cards[i], cards[j]] = [cards[j], cards[i]];
    }
    render();
  });

  document.getElementById("print").addEventListener("click", () => window.print());

  render();
</script>
</body>
</html>
