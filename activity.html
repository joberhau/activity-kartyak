<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14112a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Activity Kártyák</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@500;700&display=swap">
<style>
  :root {
    --bg: #14112a; --ink: #f4f2ff; --muted: #a9a4cc; --line: rgba(255,255,255,.14); --glass: rgba(255,255,255,.08);
    --draw: #ff8a1f; --draw2: #c95a00;
    --talk: #2fa8f0; --talk2: #0f6fb5;
    --mime: #ffd23f; --mime2: #d9a400; --danger: #ff4d5e;
    --gold: #ffc83d;
    --display: "Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
    --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 500 16px/1.35 var(--body); overflow: hidden;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  /* Mozgó háttér */
  .bg { position: fixed; inset: 0; overflow: hidden; z-index: 0; }
  .bg i { position: absolute; width: 70vmax; height: 70vmax; border-radius: 50%; filter: blur(70px); opacity: .5; will-change: transform; }
  .bg i:nth-child(1) { background: var(--draw); left: -30vmax; top: -25vmax; animation: drift1 18s ease-in-out infinite alternate; }
  .bg i:nth-child(2) { background: var(--talk); right: -35vmax; top: 10vmax; animation: drift2 22s ease-in-out infinite alternate; }
  .bg i:nth-child(3) { background: var(--mime); left: -10vmax; bottom: -40vmax; animation: drift3 26s ease-in-out infinite alternate; }
  .bg::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 30%, transparent 0, var(--bg) 85%); opacity: .75; }
  @keyframes drift1 { to { transform: translate(35vmax, 25vmax) scale(1.15); } }
  @keyframes drift2 { to { transform: translate(-30vmax, 20vmax) scale(.9); } }
  @keyframes drift3 { to { transform: translate(30vmax, -25vmax) scale(1.2); } }

  .app { position: relative; z-index: 1; height: 100dvh; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px;
    padding: max(10px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); }

  .top { display: flex; align-items: center; gap: 10px; }
  .top h1 { font: 800 1.6rem/1 var(--display); margin: 0; letter-spacing: -.02em; flex: 1;
    background: linear-gradient(90deg, var(--draw), var(--mime), var(--talk)); -webkit-background-clip: text; background-clip: text; color: transparent;
    background-size: 200% 100%; animation: shimmer 6s linear infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .left { color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; }
  .icon-btn { width: 44px; height: 44px; border-radius: 14px; background: var(--glass); border: 1px solid var(--line); display: grid; place-items: center; }
  .icon-btn.armed { background: var(--gold); color: #2a1a00; border-color: transparent; }
  .left { white-space: nowrap; }
  .icon-btn svg { width: 22px; height: 22px; }

  .board { display: flex; gap: 8px; cursor: pointer; }
  .team { flex: 1; min-width: 0; padding: 8px 10px; border-radius: 14px; background: var(--glass); border: 1px solid var(--line);
    border-bottom: 3px solid var(--tc); display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
  .team.turn { border-color: var(--tc); box-shadow: 0 0 0 2px var(--tc), 0 0 22px -4px var(--tc); animation: glow 1.8s ease-in-out infinite; }
  .team.turn span { color: var(--ink); }
  @keyframes glow { 50% { box-shadow: 0 0 0 2px var(--tc), 0 0 30px 0 var(--tc); } }
  .chip.locked[aria-pressed="false"] { opacity: .35; }
  .team-add { flex: 0 0 48px; border-radius: 14px; border: 2px dashed var(--line); color: var(--muted); font: 800 1.6rem/1 var(--display); }
  .team-add:active { transform: scale(.94); }
  .team span { font-size: .78rem; font-weight: 700; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .team b { font: 800 1.5rem/1 var(--display); font-variant-numeric: tabular-nums; display: inline-block; }
  .team b.bump { animation: bump .6s cubic-bezier(.2,1.6,.4,1); }
  @keyframes bump { 0% { transform: scale(1); } 35% { transform: scale(1.7); color: var(--gold); } 100% { transform: scale(1); } }

  .chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .chip { min-height: 46px; border-radius: 14px; border: 2px solid var(--line); background: var(--glass); font-weight: 700; font-size: .88rem;
    display: flex; align-items: center; justify-content: center; gap: 6px; transition: transform .15s, background .2s, border-color .2s; }
  .chip svg { width: 18px; height: 18px; flex: none; }
  .chip:active { transform: scale(.95); }
  .chip[aria-pressed="true"] { background: var(--c); border-color: transparent; color: var(--on, #fff); box-shadow: 0 6px 18px -6px var(--c); }
  .chip[aria-pressed="false"] { color: var(--muted); }
  .k-draw { --c: var(--draw); --c2: var(--draw2); } .k-talk { --c: var(--talk); --c2: var(--talk2); } .k-mime { --c: var(--mime); --c2: var(--mime2); --on: #2a1a00; }

  /* Kártya */
  .stage { flex: 1; min-height: 0; display: grid; place-items: center; perspective: 1100px; }
  .slot { width: 100%; max-width: 340px; height: 100%; max-height: 470px; }
  .slot.enter { animation: cardIn .55s cubic-bezier(.2,1.2,.3,1) both; }
  .slot.exit { animation: cardOut .32s ease-in both; }
  @keyframes cardIn { from { opacity: 0; transform: translateY(70px) rotate(-6deg) scale(.85); } to { opacity: 1; transform: none; } }
  @keyframes cardOut { to { opacity: 0; transform: translateY(-90px) rotate(8deg) scale(.85); } }
  .card { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .75s cubic-bezier(.3,1.3,.4,1); }
  .card.flipped { transform: rotateY(180deg); }
  .front { visibility: hidden; transition: visibility 0s .3s; }
  .card.flipped .front { visibility: visible; }
  .card.flipped .back { visibility: hidden; transition: visibility 0s .3s; }
  .card.noanim .front, .card.noanim .back { transition: none; }
  .card.noanim { transition: none; }
  .face { position: absolute; inset: 0; border-radius: 26px; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden;
    box-shadow: 0 24px 50px -18px rgba(0,0,0,.7), inset 0 0 0 2px rgba(255,255,255,.18); }

  .back { visibility: visible; transition: visibility 0s 0s; background: linear-gradient(145deg, #3a2a8f, #1d1450 60%, #2b1a6b); display: grid; place-items: center; text-align: center; padding: 20px; }
  .back::before { content: ""; position: absolute; inset: 0; opacity: .22;
    background: repeating-linear-gradient(45deg, #fff 0 2px, transparent 2px 22px); animation: slide 8s linear infinite; }
  .back::after { content: ""; position: absolute; top: -20%; bottom: -20%; width: 40%; left: -60%; transform: rotate(20deg);
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent); animation: shine 3.6s ease-in-out infinite; }
  @keyframes slide { to { background-position: 62px 0; } }
  @keyframes shine { 0%, 55% { left: -60%; } 100% { left: 130%; } }
  .logo { position: relative; z-index: 1; display: grid; gap: 12px; justify-items: center; }
  .logo .q { width: 104px; height: 104px; border-radius: 50%; display: grid; place-items: center; font: 800 4.2rem/1 var(--display);
    background: conic-gradient(from 0deg, var(--draw), var(--gold), var(--mime), var(--talk), var(--draw)); color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,.25);
    animation: bob 2.4s ease-in-out infinite, spin 9s linear infinite; }
  .logo .q span { width: 86px; height: 86px; border-radius: 50%; background: #241862; display: grid; place-items: center; animation: unspin 9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes unspin { to { transform: rotate(-360deg); } }
  .logo .q { animation: spin 9s linear infinite; }
  .logo .t { font: 800 1.9rem/1.05 var(--display); }
  .logo .s { color: #cfc9f5; font-size: .95rem; max-width: 22ch; }
  .logo .pulse { animation: bob 2.4s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

  .front { transform: rotateY(180deg); background: linear-gradient(160deg, var(--c), var(--c2)); color: var(--on, #fff); padding: 18px; display: flex; flex-direction: column; }
  .front .wm { position: absolute; right: -12%; bottom: -8%; width: 78%; opacity: .13; animation: floaty 7s ease-in-out infinite; pointer-events: none; }
  .front .wm svg { width: 100%; height: auto; display: block; stroke-width: 1.4; }
  @keyframes floaty { 0%, 100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-14px) rotate(6deg); } }
  .meta { display: flex; align-items: center; justify-content: space-between; position: relative; }
  .cat { display: flex; align-items: center; gap: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; font-size: .85rem; }
  .cat svg { width: 22px; height: 22px; }
  .pts { font: 800 2.3rem/1 var(--display); background: rgba(255,255,255,.2); border-radius: 14px; padding: 4px 12px; font-variant-numeric: tabular-nums; }
  .word-wrap { flex: 1; display: grid; place-items: center; text-align: center; position: relative; padding: 6px 0; }
  .word { font: 800 3.2rem/1.04 var(--display); letter-spacing: -.015em; text-wrap: balance; overflow-wrap: anywhere; hyphens: auto; text-shadow: 0 3px 0 rgba(0,0,0,.18); }
  .rule { position: relative; font-size: .85rem; color: inherit; text-align: center; background: rgba(0,0,0,.18); border-radius: 12px; padding: 8px 10px; }
  .foot { position: relative; display: flex; align-items: center; justify-content: space-between; margin-top: 10px; font-weight: 700; font-size: .85rem; text-transform: uppercase; letter-spacing: .06em; }
  .dots { display: flex; gap: 6px; }
  .dots i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid currentColor; }
  .dots i.on { background: currentColor; }

  /* Idő */
  .timer { min-height: 40px; display: flex; align-items: center; gap: 12px; }
  .track { flex: 1; height: 10px; border-radius: 6px; background: var(--glass); overflow: hidden; border: 1px solid var(--line); }
  .track b { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--talk), var(--mime)); transform-origin: left; transition: transform .25s linear, background .3s; border-radius: 6px; }
  .secs { font: 800 1.9rem/1 var(--display); min-width: 3ch; text-align: right; font-variant-numeric: tabular-nums; }
  .timer.low .track b { background: linear-gradient(90deg, var(--danger), #ff7a59); }
  .timer.low .secs { color: var(--danger); animation: tickpulse 1s ease-in-out infinite; }
  .timer.over .secs { color: var(--danger); }
  .tlabel { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--talk); }
  .timer.steal .secs { color: var(--talk); }
  @keyframes tickpulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.25); } }
  .stage.shake .slot { animation: shake .5s; }
  @keyframes shake { 0%, 100% { transform: none; } 20% { transform: translateX(-10px) rotate(-2deg); } 40% { transform: translateX(10px) rotate(2deg); } 60% { transform: translateX(-8px); } 80% { transform: translateX(8px); } }

  .bar { display: grid; grid-template-columns: 1fr 1.5fr; gap: 10px; }
  .btn { min-height: 58px; border-radius: 18px; font: 800 1.05rem/1.1 var(--display); background: var(--glass); border: 1px solid var(--line); padding: 0 12px;
    transition: transform .12s; }
  .btn:active { transform: scale(.96); }
  .btn.main { background: linear-gradient(135deg, var(--gold), #ff9d2e); color: #2a1a00; border: 0; box-shadow: 0 10px 24px -10px var(--gold); }
  .btn.main.go { background: linear-gradient(135deg, #19c58b, #0fa874); color: #04221a; box-shadow: 0 10px 24px -10px #19c58b; }
  .btn[hidden] { display: none; }
  .bar.solo { grid-template-columns: 1fr; }
  .btn.main.attn { animation: attn 1.6s ease-in-out infinite; }
  @keyframes attn { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }

  .toast { position: fixed; left: 50%; top: max(12px, env(safe-area-inset-top)); transform: translate(-50%, -80px); z-index: 20; background: #fff; color: #1b1740;
    font-weight: 700; padding: 10px 16px; border-radius: 999px; transition: transform .35s cubic-bezier(.2,1.4,.4,1); max-width: 90vw; text-align: center; }
  .toast.show { transform: translate(-50%, 0); }

  /* Csapatválasztó */
  .veil { position: fixed; inset: 0; background: rgba(8,6,24,.6); z-index: 10; opacity: 0; pointer-events: none; transition: opacity .25s; }
  .veil.open { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; max-width: 480px; margin: 0 auto; background: #231d4d; border-radius: 26px 26px 0 0;
    padding: 18px 16px max(18px, env(safe-area-inset-bottom)); transform: translateY(105%); transition: transform .35s cubic-bezier(.2,1,.3,1); border: 1px solid var(--line); }
  .sheet.open { transform: none; }
  .sheet h2 { font: 800 1.3rem/1.1 var(--display); margin: 0 0 14px; text-align: center; }
  .picks { display: grid; gap: 10px; }
  .pick { min-height: 60px; border-radius: 18px; background: var(--tc); color: #1b1200; font: 800 1.15rem/1 var(--display); display: flex; align-items: center; justify-content: space-between; padding: 0 18px; }
  .pick:active { transform: scale(.97); }
  .pick i { font-style: normal; background: rgba(0,0,0,.2); border-radius: 10px; padding: 4px 10px; }
  .cancel { width: 100%; margin-top: 10px; min-height: 48px; color: var(--muted); font-weight: 700; }

  /* Beállítások */
  dialog { border: 1px solid var(--line); border-radius: 24px; background: #231d4d; color: var(--ink); width: min(92vw, 440px); max-height: 88dvh; padding: 0; }
  dialog::backdrop { background: rgba(8,6,24,.7); }
  .dlg { padding: 18px; display: grid; gap: 16px; }
  .dlg h2 { font: 800 1.35rem/1 var(--display); margin: 0; }
  .field { display: grid; gap: 8px; }
  .field > label, .field > .lab { font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
  .seg button { min-height: 44px; border-radius: 12px; border: 2px solid var(--line); font-weight: 700; background: var(--glass); }
  .seg button[aria-pressed="true"] { background: var(--gold); color: #2a1a00; border-color: transparent; }
  .names { display: grid; gap: 8px; }
  .names input { font: inherit; min-height: 44px; border-radius: 12px; border: 2px solid var(--line); background: rgba(0,0,0,.25); color: var(--ink); padding: 0 12px; width: 100%; user-select: text; -webkit-user-select: text; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .small { min-height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--glass); font-weight: 700; font-size: .9rem; }
  .done { min-height: 52px; border-radius: 16px; background: var(--gold); color: #2a1a00; font: 800 1.05rem/1 var(--display); }

  /* Játéktábla: az eredeti Activity táblája, állítva: rajt fent, cél lent, 2 soronként váltakozó szín */
  .boardview { position: fixed; inset: 0; z-index: 12; background: rgba(20,17,42,.97); opacity: 0; pointer-events: none; transform: translateY(24px); transition: opacity .3s, transform .3s; }
  .boardview.open { opacity: 1; pointer-events: auto; transform: none; }
  .bvin { max-width: 480px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 10px;
    padding: max(12px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); }
  .bvhead { display: flex; align-items: center; justify-content: space-between; }
  .bvhead h2 { font: 800 1.5rem/1 var(--display); margin: 0; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; font-size: .85rem; font-weight: 700; background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; }
  .legend span.turn { border-color: var(--tc); }
  .legend i { width: 14px; height: 14px; border-radius: 50%; background: var(--tc); border: 2px solid #fff; }
  .trackwrap { flex: 1; min-height: 0; overflow: auto; border-radius: 16px; }
  .trackbox { position: relative; width: 100%; height: 100%; min-height: 400px; }
  .cell { position: absolute; padding: 2px; }
  .cell > div { position: relative; width: 100%; height: 100%; border-radius: 9px; display: grid; place-items: center;
    background: #1d1842; background: color-mix(in srgb, var(--cc) 16%, #15112e); border-bottom: 3px solid var(--cc); color: var(--cc); font: 800 1.05rem/1 var(--display); }
  .cell small { position: absolute; left: 6px; top: 3px; font: 700 .58rem/1 var(--body); color: var(--muted); }
  .cell.start > div { background: linear-gradient(90deg, #1c7a5a, #17b37e); color: #04221a; border: 0; letter-spacing: .3em; font-size: .9rem; }
  .cell.fin > div { background: repeating-conic-gradient(#111 0 25%, #fff 0 50%) 0 0 / 22px 22px; border: 0; color: #111; font-size: .9rem; }
  .cell.fin > div span { background: #fff; padding: 3px 14px; border-radius: 8px; letter-spacing: .3em; }
  .pawn { position: absolute; aspect-ratio: 1; transform: translate(-50%, -50%); transition: left .17s ease, top .17s ease; z-index: 2; }
  .pawn b { display: grid; place-items: center; width: 100%; height: 100%; border-radius: 50%; background: var(--tc); border: 2px solid #fff;
    color: #1b1200; font: 800 .6rem/1 var(--display); box-shadow: 0 4px 8px rgba(0,0,0,.55); }
  .pawn.hop b { animation: hop .17s; }
  @keyframes hop { 50% { transform: translateY(-70%) scale(1.25); } }
  .bvwin { text-align: center; display: grid; gap: 10px; }
  .bvwin h3 { font: 800 1.8rem/1.1 var(--display); margin: 0; color: var(--gold); animation: bob 1.6s ease-in-out infinite; }
  .bvwin[hidden], #bvGo[hidden], .icon-btn[hidden] { display: none; }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }

  @media (max-height: 640px) {
    .word { font-size: 2.6rem; } .btn { min-height: 52px; } .logo .q { width: 84px; height: 84px; font-size: 3.4rem; } .logo .q span { width: 68px; height: 68px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001s !important; animation-iteration-count: 1 !important; transition-duration: .001s !important; }
    .bg i { animation: none !important; }
  }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>

<main class="app">
  <header class="top">
    <h1>Activity</h1>
    <span class="left" id="left"></span>
    <button class="icon-btn" id="newBtn" aria-label="Új játék">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1015.5-6.2L21 8"/><path d="M21 3v5h-5"/></svg>
    </button>
    <button class="icon-btn" id="boardBtn" aria-label="Tábla">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4"/><path d="M5 4h13l-2.5 4L18 12H5"/></svg>
    </button>
    <button class="icon-btn" id="gear" aria-label="Beállítások">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
    </button>
  </header>

  <section class="board" id="board" aria-label="Pontszám"></section>

  <div class="chips" role="group" aria-label="Kategóriák">
    <button class="chip k-draw" data-k="draw"></button>
    <button class="chip k-talk" data-k="talk"></button>
    <button class="chip k-mime" data-k="mime"></button>
  </div>

  <section class="stage" id="stage" aria-label="Kártya">
    <div class="slot" id="slot">
      <div class="card" id="card">
        <div class="face back" id="back"></div>
        <div class="face front" id="front"></div>
      </div>
    </div>
  </section>

  }
  function renderSettings() {
    seg("segMode", [["board", "Táblás"], ["free", "Szabad"]], () => S.mode, (v) => { S.mode = v; syncCat(); renderChips(); renderBoard(); renderBack(); render(); });
    seg("segTeams", [[2, "2"], [3, "3"], [4, "4"]], () => S.teamCount, (v) => { S.teamCount = v; if (S.turn >= v) S.turn = 0; syncCat(); renderNames(); renderBoard(); renderChips(); renderBack(); });
    seg("segTime", [[30, "30 mp"], [60, "60 mp"], [90, "90 mp"]], () => S.time, (v) => { S.time = v; if (phase === "idle" || phase === "down") { timeLeft = v; renderTimer(); } });
    seg("segLevel", [["easy", "Könnyebb"], ["mix", "Vegyes"], ["hard", "Nehezebb"]], () => S.level, (v) => { S.level = v; renderLeft(); });
    seg("segBoard", [[24, "Rövid (24)"], [48, "Eredeti (48)"]], () => S.boardLen, (v) => { S.boardLen = v; syncCat(); renderChips(); renderBoard(); renderBack(); });
    seg("segSound", [[true, "Be"], [false, "Ki"]], () => S.sound, (v) => { S.sound = v; });
    renderNames();
  }
  function renderNames() {
    const w = $("names"); w.textContent = "";
    for (let i = 0; i < S.teamCount; i++) {
      const inp = document.createElement("input"); inp.value = S.names[i]; inp.maxLength = 16; inp.setAttribute("aria-label", (i + 1) + ". csapat neve");
      inp.style.borderLeft = "6px solid " + TEAM_COLORS[i];
      inp.addEventListener("input", () => { S.names[i] = inp.value.trim() || "Csapat " + (i + 1); save(); renderBoard(); });
      w.appendChild(inp);
    }
  }
  const dlg = $("settings");
  $("gear").addEventListener("click", () => { renderSettings(); if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", ""); });
  $("board").addEventListener("click", () => $("gear").click());
  $("closeSettings").addEventListener("click", () => dlg.close ? dlg.close() : dlg.removeAttribute("open"));
  dlg.addEventListener("click", (e) => { if (e.target === dlg) dlg.close(); });
  $("resetDeck").addEventListener("click", () => { seen.clear(); save(); renderLeft(); toast("A pakli újra tele van."); });
  let armed = false, armT = 0;
  $("resetScores").addEventListener("click", () => {
    const b = $("resetScores");
    if (!armed) { armed = true; b.textContent = "Biztosan?"; armT = setTimeout(() => { armed = false; b.textContent = "Új játék"; }, 3000); return; }
    clearTimeout(armT); armed = false; b.textContent = "Új játék";
    newGame(); toast("Új játék indul."); if (dlg.close) dlg.close();
  });

  syncCat(); renderChips(); renderBoard(); renderBack(); render();
})();
</script>
</body>
</html>
